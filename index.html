		<script>
(function(){
 const canvas=document.getElementById('canvas');
 const probe=document.getElementById('safe-area-probe');
 let scheduled=false;
 function fit(){
  scheduled=false;
  const vv=window.visualViewport;
  const width=Math.max(1,vv?vv.width:innerWidth);
  const height=Math.max(1,vv?vv.height:innerHeight);
  const scale=Math.min(2,Math.max(1,window.devicePixelRatio||1));
  const backingWidth=Math.max(1,Math.floor(width*scale));
  const backingHeight=Math.max(1,Math.floor(height*scale));
  // Policy 0 leaves CSS sizing to this shell; Godot detects backing-size changes.
  if(canvas.width!==backingWidth)canvas.width=backingWidth;
  if(canvas.height!==backingHeight)canvas.height=backingHeight;
  canvas.style.setProperty('width',width+'px','important');
  canvas.style.setProperty('height',height+'px','important');
  canvas.style.setProperty('left',(vv?vv.offsetLeft:0)+'px','important');
  canvas.style.setProperty('top',(vv?vv.offsetTop:0)+'px','important');
  const c=getComputedStyle(probe);
  window.__SAFE_INSETS__={top:parseFloat(c.paddingTop)||0,right:parseFloat(c.paddingRight)||0,bottom:parseFloat(c.paddingBottom)||0,left:parseFloat(c.paddingLeft)||0};
  window.__FORMAL_VIEWPORT__={width,height,offsetLeft:vv?vv.offsetLeft:0,offsetTop:vv?vv.offsetTop:0,dpr:scale,backingWidth,backingHeight};
 }
 function requestFit(){if(!scheduled){scheduled=true;requestAnimationFrame(fit);}}
 addEventListener('resize',requestFit,{passive:true});
 addEventListener('orientationchange',requestFit,{passive:true});
 addEventListener('pageshow',requestFit,{passive:true});
 if(window.visualViewport){visualViewport.addEventListener('resize',requestFit,{passive:true});visualViewport.addEventListener('scroll',requestFit,{passive:true});}
 for(const event of ['gesturestart','gesturechange'])canvas.addEventListener(event,e=>e.preventDefault(),{passive:false});
 fit();
})();
</script>

<script>
// Only lifecycle time anchors live here; progress, XP and furniture remain in Godot user://.
(function(){
 const qa=new URLSearchParams(location.search);
 if(qa.get('roomqa')==='1'&&qa.get('timeqa')==='1')return; // Disposable room fixture must never touch the normal lifecycle journal.
 const prefix='xiping-godot-away-v1-';
 const activeKey=prefix+'active';
 let openId=null;
 let visibleStarted=document.hidden?null:Date.now();
 window.__FORMAL_VISIBLE_STARTED_MS__=visibleStarted;
 function read(key){try{return JSON.parse(localStorage.getItem(key)||'null');}catch(_){return null;}}
 function write(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch(_){}}
 function hidden(){
  const g=window.__FORMAL_GODOT__;
  if(!g||!g.state)return;
  if(openId)return;
  const mode=g.demo?'demo':'real';
  const key=prefix+mode;
  const prior=read(activeKey),ongoing=read(key);
  if(prior&&prior.mode===mode&&ongoing&&ongoing.id===prior.id&&ongoing.end_ms===null){openId=ongoing.id;return;}
  const id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random());
  const visit=g.state.visit_session&&typeof g.state.visit_session==='object'?JSON.parse(JSON.stringify(g.state.visit_session)):{};
  const a={id,start_ms:Date.now(),end_ms:null,mul:g.demo?60:1,stage:g.state.arc.stage,can_advance:!g.state.arc.active&&g.state.arc.stage<6,mechanism_version:1,mode,visit_session:visit};
  visibleStarted=null;window.__FORMAL_VISIBLE_STARTED_MS__=null;
  write(key,a);write(activeKey,{mode,id});openId=id;
 }
 function visible(){
  if(visibleStarted===null)visibleStarted=Date.now();
  window.__FORMAL_VISIBLE_STARTED_MS__=visibleStarted;
  const active=read(activeKey);
  if(active){const key=prefix+active.mode,a=read(key);if(a&&a.id===active.id&&a.end_ms===null){a.end_ms=Date.now();write(key,a);}}
  openId=null;
 }
 window.__formalRecordHidden=hidden;
 window.__formalRecordVisible=visible;
 document.addEventListener('visibilitychange',()=>document.hidden?hidden():visible(),{capture:true});
 window.addEventListener('pagehide',hidden,{capture:true});
 window.addEventListener('pageshow',()=>{if(!document.hidden)visible();},{capture:true});
 if(!document.hidden)visible();
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4270404,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
// The formal game owns its visual viewport and a separate IDBFS mount.
GODOT_CONFIG.canvasResizePolicy = 0;
GODOT_CONFIG.persistentPaths = ['/userfs/xiping-yangcheng-godot'];
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
